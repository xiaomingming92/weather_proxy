services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: ${PROJECT_NAME:-weather-proxy}-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - ~/data/weather_proxy/postgres:/var/lib/postgresql/data:Z
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${DATABASE_USER:-dev}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-frady}
      POSTGRES_DB: ${PROJECT_NAME:-weather-proxy}
      TZ: "Asia/Shanghai"
    networks:
      - ${PROJECT_NAME:-weather-proxy}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dev} -d ${PROJECT_NAME:-weather-proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ${PROJECT_NAME:-weather-proxy}-network:
    driver: bridge
